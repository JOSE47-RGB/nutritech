name: nutritech
services:
  db:
    image: docker.io/library/mariadb:10.11
    restart: unless-stopped
    environment:
      MARIADB_DATABASE: nutritech
      MARIADB_USER: nutritech
      MARIADB_PASSWORD: ${DB_PASSWORD:?Ejecuta node infra/prepare-local.cjs}
      MARIADB_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:?Falta clave root}
      TZ: UTC
    volumes:
      - db_data:/var/lib/mysql
      - ./database/nutritech.sql:/docker-entrypoint-initdb.d/000-schema.sql:ro,z
      - ./database/migrations/001-permisos-utc.sql:/docker-entrypoint-initdb.d/001.sql:ro,z
      - ./database/migrations/002-evaluaciones-edema.sql:/docker-entrypoint-initdb.d/002.sql:ro,z
      - ./database/migrations/003-orientaciones-guardadas.sql:/docker-entrypoint-initdb.d/003.sql:ro,z
      - ./database/migrations/004-valoraciones-medicas.sql:/docker-entrypoint-initdb.d/004.sql:ro,z
      - ./database/migrations/005-alertas-orientacion.sql:/docker-entrypoint-initdb.d/005.sql:ro,z
      - ./database/migrations/006-reportes-imprimibles.sql:/docker-entrypoint-initdb.d/006.sql:ro,z
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 10s
      timeout: 5s
      retries: 12
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    restart: unless-stopped
    environment:
      DATABASE_URL: mysql://nutritech:${DB_PASSWORD}@db:3306/nutritech
      JWT_SECRET: ${JWT_SECRET:?Falta JWT_SECRET}
      CERTIFICATE_HMAC_KEY: ${CERTIFICATE_HMAC_KEY:?Falta clave HMAC}
      CERTIFICATE_ENCRYPTION_KEY: ${CERTIFICATE_ENCRYPTION_KEY:?Falta clave de certificados}
      BACKUP_ENCRYPTION_KEY: ${BACKUP_ENCRYPTION_KEY:?Falta clave de respaldos}
      APP_ORIGINS: https://localhost:8443,https://127.0.0.1:8443
      APP_TIMEZONE: America/Guatemala
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3017/').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 5s
      timeout: 5s
      retries: 20
    volumes:
      - backups:/app/database/backups
    depends_on:
      db:
        condition: service_healthy
  web:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    restart: unless-stopped
    ports:
      - "127.0.0.1:8443:443"
    volumes:
      - ./infra/certs:/etc/nginx/certs:ro,z
    depends_on:
      backend:
        condition: service_healthy
volumes:
  db_data:
  backups:
